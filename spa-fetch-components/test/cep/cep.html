<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Cep</title>

    <script src="cep.js" defer></script>
</head>
<body>
    <h1><strong>CEP</strong></h1>
    <input type="text" placeholder="Digite o Cep" class="cep">
    <button id="buttonThen">Buscar com .then()</button>
    <p id="resultadoBusca"></p>

    <button id="awayBusca">Buscar com await/async</button>

    <script>
        // EXERCÍCIO CEP:
const inputCep = document.querySelector('.cep');

const buttonThen = document.querySelector('#buttonThen');
const contentResultadoBusca = document.querySelector('#resultadoBusca')
const contentAwayBusca = document.querySelector('#awayBusca')



const resultadoBusca = buttonThen.addEventListener('click', async = () => {
    const valueCep = inputCep.value
    const url = `https://viacep.com.br/ws/${valueCep}/json/`;
    fetch(url)
        .then((resposta) => {
            if (!resposta.ok) {
                console.log(resposta)
                throw new Error('Erro na Requisição.');
               
            };
            return resposta.json();
        })
        .then((dados) => {
            if (dados.erro) {
                throw new Error('Cep inválido ou não encontrado.');
            };
            console.log(dados);
        })
        .catch((error) => {
            console.warn(error.message);
        })
    }
);

const url = 'https://viacep.com.br/ws/01001000/json/';
const consulta = fetch(url);

async function buscarCep(){
    try{
        let resposta = await consulta;
        if (!resposta.ok){
            throw new Error('Erro na requisição')
        }
        let dataObj = await resposta.json();
        if (dataObj.erro){
            throw new Error('Cep inválido ou não encontrado.');
        }
        console.log(dataObj);

    }catch(error){
        console.warn('Erro:', error.message)
    }
};

buscarCep();
    </script>
</body>
</html>
